spring.application.name=police-bandobast-api

server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3306/bandobast
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update

spring.datasource.hikari.auto-commit=false

# Jackson 3 rejects JSON that omits primitive fields (e.g. id); default them to 0/false instead
spring.jackson.deserialization.fail-on-null-for-primitives=false